name: Build LibreTV iOS IPA (unsigned / TrollStore)

on:
  push:
    branches: [ios-build]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust with iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install npm dependencies (latest Tauri CLI)
        run: |
          npm install
          npm install -D @tauri-apps/cli@latest

      - name: Tauri iOS init (generate Xcode project)
        run: |
          npx tauri ios init --ci

      - name: Set deployment target to iOS 14 via xcconfig
        run: |
          cat > src-tauri/gen/apple/iOS14.xcconfig <<'EOF'
          IPHONEOS_DEPLOYMENT_TARGET = 14.0;
          EOF
          # Add xcconfig to the project if not already present
          find src-tauri/gen/apple/app.xcodeproj -name "project.pbxproj" -exec grep -l "iOS14.xcconfig" {} \; || echo "will apply via XCConfig at build time"

      - name: Build unsigned IPA (--no-sign)
        run: |
          set -o pipefail
          npx tauri ios build --target aarch64 --no-sign --ci \
            | tee ios-build.log || (echo "=== build log tail ==="; tail -100 ios-build.log; exit 1)

      - name: Locate built IPA
        run: |
          IPA=$(find . -name "*.ipa" -type f | head -1)
          echo "IPA at: $IPA"
          ls -la "$IPA"
          cp "$IPA" LibreTV.ipa
          ls -la LibreTV.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibreTV-ipa
          path: LibreTV.ipa
          if-no-files-found: error