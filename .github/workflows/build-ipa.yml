name: Build LibreTV iOS IPA (unsigned / TrollStore)

on:
  push:
    branches: [ios-build]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust with iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install npm dependencies (latest Tauri CLI)
        run: |
          npm install
          npm install -D @tauri-apps/cli@latest

      - name: Tauri iOS init (generate Xcode project)
        run: |
          npx tauri ios init --ci

      - name: Patch Info.plist (ATS allow HTTP for vod/stream sources)
        run: |
          PLIST=$(find src-tauri/gen/apple -name "Info.plist" | grep -v Pods | head -1)
          echo "Patching: $PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$PLIST"

      - name: Build unsigned .app via xcodebuild (direct, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace src-tauri/gen/apple/app.xcodeproj/project.xcworkspace \
            -scheme app_iOS \
            -configuration release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            build | tee xcodebuild.log
          echo "=== exit: ${PIPESTATUS[0]} ==="

      - name: Locate .app and pack IPA
        run: |
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then APP_PATH=$(find . -name "*.app" -type d -path "*Release*" | head -1); fi
          echo "App at: $APP_PATH"
          ls -la "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/LibreTV.app
          # Ad-hoc sign so bundle structure is valid for TrollStore
          codesign --force --deep --sign - Payload/LibreTV.app || echo "ad-hoc sign skipped"
          zip -r LibreTV.ipa Payload -x "*.DS_Store"
          ls -la LibreTV.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibreTV-ipa
          path: LibreTV.ipa
          if-no-files-found: error