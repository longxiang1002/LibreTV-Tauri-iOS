[package]
name = "app"
version = "0.1.0"
description = "LibreTV Tauri client (iOS 14+ compatible)"
authors = ["bestZwei", "longxiang1002"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
once_cell = "1.19.0"
tauri = { version = "2", features = ["custom-protocol"] }
urlencoding = "2.1.3"
scraper = "0.19.0"
reqwest = { version = "0.11.27", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1.35", features = ["macros", "rt-multi-thread"] }